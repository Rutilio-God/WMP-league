<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMP League - Championship Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,900;1,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-base: #0e0f11;
            --surface: #15171a;
            --surface-hover: #1c1f24;
            --primary: #00e5ff; /* Cyan Neon */
            --danger: #e10600; /* F1 Red */
            --text-main: #f1f5f9;
            --text-muted: #8b949e;
            --border: #23252a;
            --gold: #ffc800;
            --silver: #cbd5e1;
            --bronze: #cd7f32;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Top Navbar Header */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: var(--bg-base);
            border-bottom: 1px solid var(--border);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            background: var(--danger);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            box-shadow: 0 4px 15px rgba(225, 6, 0, 0.4);
        }

        .logo-text h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 20px;
            font-weight: 900;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .logo-text span {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Toggle Central */
        .center-toggles {
            display: flex;
            background: var(--surface);
            border-radius: 8px;
            padding: 4px;
            border: 1px solid var(--border);
            gap: 5px;
            overflow-x: auto;
            max-width: 50%;
        }

        .tab-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .tab-btn:hover { color: var(--text-main); }
        .tab-btn.active {
            background: var(--danger);
            color: white;
            box-shadow: 0 2px 10px rgba(225, 6, 0, 0.3);
        }

        /* Toggle Lectura/Admin */
        .mode-toggles {
            display: flex;
            background: var(--surface);
            border-radius: 20px;
            padding: 4px;
            border: 1px solid var(--border);
        }

        .mode-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 6px 16px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .mode-btn.active-read { background: #2c313a; color: white; }
        .mode-btn.active-admin { background: var(--primary); color: #000; box-shadow: 0 0 10px rgba(0, 229, 255, 0.3); }

        .container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Dashboard Cards */
        .dashboard-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: 0.3s;
        }
        .card:hover { border-color: rgba(255,255,255,0.1); transform: translateY(-2px); }

        .card-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }
        .card-1 { background: rgba(255, 200, 0, 0.1); color: var(--gold); border: 1px solid rgba(255, 200, 0, 0.2); }
        .card-2 { background: rgba(0, 229, 255, 0.1); color: var(--primary); border: 1px solid rgba(0, 229, 255, 0.2); }
        .card-3 { background: rgba(225, 6, 0, 0.1); color: var(--danger); border: 1px solid rgba(225, 6, 0, 0.2); }
        .card-4 { background: rgba(139, 148, 158, 0.1); color: var(--text-muted); border: 1px solid var(--border); }

        .card-info { display: flex; flex-direction: column; }
        .card-info span { font-size: 11px; color: var(--text-muted); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
        .card-info h4 { margin: 0; font-size: 16px; font-weight: 700; color: var(--text-main); }
        .card-info small { font-size: 12px; color: var(--primary); font-weight: 700; margin-top: 2px; }

        /* Toolbar Controls */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .search-box {
            position: relative;
            width: 100%;
            max-width: 400px;
        }
        .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .search-box input {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 12px 12px 12px 40px;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
        }
        .search-box input:focus { outline: none; border-color: var(--primary); }

        .admin-actions { display: none; gap: 10px; flex-wrap: wrap; }
        .btn {
            background: var(--surface); color: var(--text-main);
            border: 1px solid var(--border); padding: 10px 16px;
            border-radius: 8px; cursor: pointer; font-weight: 600;
            display: flex; align-items: center; gap: 8px; font-size: 13px;
            transition: 0.2s;
        }
        .btn:hover { background: var(--surface-hover); }
        .btn-add { background: var(--danger); border-color: var(--danger); color: white; }
        .btn-add:hover { background: #b30500; }
        .btn-sys { border-color: var(--primary); color: var(--primary); }
        .btn-sys:hover { background: rgba(0, 229, 255, 0.1); }

        /* Table */
        .table-container {
            background: var(--surface);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow-x: auto;
        }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        th {
            padding: 16px 20px; color: var(--text-muted);
            font-size: 11px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1px; border-bottom: 1px solid var(--border);
        }
        td {
            padding: 12px 20px; border-bottom: 1px solid var(--border);
            font-size: 14px; font-weight: 500;
        }
        tr:hover td { background: rgba(255,255,255,0.02); }
        tr:last-child td { border-bottom: none; }

        /* Badges & Styling */
        .pos-badge {
            width: 28px; height: 28px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-weight: 700; font-size: 13px; background: transparent; color: var(--text-main);
        }
        .pos-1 .pos-badge { background: var(--gold); color: #000; box-shadow: 0 0 15px rgba(255,200,0,0.4); }
        .pos-2 .pos-badge { background: var(--silver); color: #000; }
        .pos-3 .pos-badge { background: var(--bronze); color: #fff; }

        .driver-num { color: var(--text-muted); font-weight: 700; margin-right: 8px; font-size: 12px; }
        .team-dot {
            display: inline-block; width: 10px; height: 10px;
            border-radius: 50%; margin-right: 8px; box-shadow: 0 0 5px currentColor;
        }
        .penal-box {
            background: rgba(225, 6, 0, 0.15); color: #ff6b6b;
            padding: 2px 8px; border-radius: 4px; border: 1px solid rgba(225, 6, 0, 0.3); font-size: 12px;
        }

        .action-icons { display: flex; gap: 15px; color: var(--text-muted); }
        .action-icons i { cursor: pointer; transition: 0.2s; }
        .action-icons i:hover { color: var(--primary); }
        .action-icons i.fa-trash:hover { color: var(--danger); }

        .editable { cursor: pointer; position: relative; }
        .editable:hover { color: var(--primary); }

        /* Modal Styles */
        .modal {
            display: none; 
            position: fixed; z-index: 1000; left: 0; top: 0;
            width: 100%; height: 100%; overflow: auto;
            background-color: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background-color: var(--surface);
            margin: 10% auto;
            padding: 25px;
            border: 1px solid var(--primary);
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.15);
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px;
        }
        .modal-header h2 { margin: 0; font-size: 18px; color: var(--primary); }
        .close-modal { color: var(--text-muted); font-size: 24px; font-weight: bold; cursor: pointer; }
        .close-modal:hover { color: var(--danger); }
        .modal-body { display: flex; flex-direction: column; gap: 15px; }

    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo-area">
            <div class="logo-icon"><i class="fa-solid fa-trophy"></i></div>
            <div class="logo-text">
                <h1>WMP League</h1>
                <span>Championship Portal</span>
            </div>
        </div>

        <div class="center-toggles" id="tabsContainer">
            <!-- Tabs dinámicas -->
        </div>

        <div class="mode-toggles">
            <button id="btnRead" class="mode-btn active-read" onclick="setMode('read')"><i class="fa-solid fa-eye"></i> Lectura</button>
            <button id="btnAdmin" class="mode-btn" onclick="setMode('admin')"><i class="fa-solid fa-lock"></i> Admin</button>
        </div>
    </nav>

    <div class="container">
        
        <div class="dashboard-cards" id="dashboardCards">
            <!-- Cards generadas por JS -->
        </div>

        <div class="controls-bar">
            <div class="search-box">
                <i class="fa-solid fa-search"></i>
                <input type="text" id="searchInput" placeholder="Buscar por nombre, equipo o número..." onkeyup="renderTable()">
            </div>
            
            <div class="admin-actions" id="adminControls">
                <button class="btn btn-sys" onclick="openSysModal()"><i class="fa-solid fa-gear"></i> Sistema</button>
                <div style="width: 2px; background: var(--border); margin: 0 5px;"></div>
                <button class="btn" onclick="addCustomTab()"><i class="fa-solid fa-folder-plus"></i> Nueva Pestaña</button>
                <button class="btn" onclick="addColumn()"><i class="fa-solid fa-table-columns"></i> Columna</button>
                <button class="btn btn-add" onclick="addDriver()"><i class="fa-solid fa-plus"></i> Añadir Piloto</button>
                <button class="btn" onclick="deleteCurrentTab()" style="border-color: var(--danger); color: var(--danger);"><i class="fa-solid fa-trash"></i> Borrar Pestaña</button>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

    </div>

    <!-- Modal del Sistema -->
    <div id="sysModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fa-solid fa-gear"></i> Configuración del Sistema</h2>
                <span class="close-modal" onclick="closeSysModal()">&times;</span>
            </div>
            <div class="modal-body">
                <button class="btn" onclick="changeAdminPin()"><i class="fa-solid fa-key"></i> Cambiar PIN de Administrador</button>
                <button class="btn" onclick="exportData()"><i class="fa-solid fa-download"></i> Exportar Copia de Seguridad</button>
                <button class="btn" onclick="importData()"><i class="fa-solid fa-upload"></i> Importar Datos</button>
                <hr style="border: 0; border-top: 1px solid var(--border); width: 100%;">
                <button class="btn btn-add" onclick="resetChampionship()"><i class="fa-solid fa-triangle-exclamation"></i> Resetear Campeonato (Borrar Todo)</button>
            </div>
        </div>
    </div>

    <script>
        // SISTEMA DE DATOS DINÁMICO
        let defaultState = {
            pin: '12345',
            drivers: [
                { id: 1, num: '1', nombre: 'Max Verstappen', equipo: 'Red Bull Racing', color: '#0600ef' },
                { id: 2, num: '16', nombre: 'Charles Leclerc', equipo: 'Ferrari', color: '#dc0000' }
            ],
            tabs: [
                { id: 't1', name: 'Pilotos', icon: 'fa-user-astronaut', cols: ['PTS', 'VIC', 'POD', 'VR', 'PEN'] },
                { id: 't2', name: 'Escuderías', icon: 'fa-shield-halved', cols: ['PTS_TOTALES'] }
            ],
            data: {} 
        };

        let state = JSON.parse(localStorage.getItem('wmp_apex_v1')) || defaultState;
        
        let isAdmin = false;
        let currentTabId = state.tabs.length > 0 ? state.tabs[0].id : null;

        function saveData() {
            localStorage.setItem('wmp_apex_v1', JSON.stringify(state));
            renderAll();
        }

        function setMode(mode) {
            if (mode === 'admin') {
                // Modificado: Ya no muestra el 12345 en el prompt
                let pin = prompt("Introduce el PIN de Administrador:");
                if (pin === state.pin) {
                    isAdmin = true;
                    document.getElementById('btnAdmin').classList.add('active-admin');
                    document.getElementById('btnRead').classList.remove('active-read');
                    document.getElementById('adminControls').style.display = 'flex';
                    renderAll();
                } else if (pin !== null) {
                    alert("PIN incorrecto. Acceso denegado.");
                }
            } else {
                isAdmin = false;
                document.getElementById('btnAdmin').classList.remove('active-admin');
                document.getElementById('btnRead').classList.add('active-read');
                document.getElementById('adminControls').style.display = 'none';
                renderAll();
            }
        }

        // FUNCIONES MODAL SISTEMA
        function openSysModal() { document.getElementById('sysModal').style.display = "block"; }
        function closeSysModal() { document.getElementById('sysModal').style.display = "none"; }
        window.onclick = function(event) {
            let modal = document.getElementById('sysModal');
            if (event.target == modal) { modal.style.display = "none"; }
        }

        function changeAdminPin() {
            let oldPin = prompt("Introduce tu PIN actual:");
            if (oldPin === state.pin) {
                let newPin = prompt("Introduce el NUEVO PIN:");
                if (newPin && newPin.trim() !== "") {
                    state.pin = newPin.trim();
                    saveData();
                    alert("PIN actualizado correctamente.");
                }
            } else if (oldPin !== null) {
                alert("PIN actual incorrecto.");
            }
        }

        function exportData() {
            let dataStr = JSON.stringify(state);
            let dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            let exportFileDefaultName = 'wmp_league_backup.json';
            let linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileDefaultName);
            linkElement.click();
            closeSysModal();
        }

        function importData() {
            let input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = e => { 
                let file = e.target.files[0]; 
                let reader = new FileReader();
                reader.readAsText(file,'UTF-8');
                reader.onload = readerEvent => {
                    try {
                        let content = readerEvent.target.result;
                        let importedState = JSON.parse(content);
                        if(importedState.pin && importedState.tabs) {
                            state = importedState;
                            currentTabId = state.tabs[0].id;
                            saveData();
                            alert("Datos importados con éxito.");
                            closeSysModal();
                        } else {
                            alert("Archivo no válido para este sistema.");
                        }
                    } catch(err) {
                        alert("Error al leer el archivo.");
                    }
                }
            }
            input.click();
        }

        function resetChampionship() {
            let confirm1 = confirm("¡PELIGRO! ¿Estás seguro de que quieres borrar TODOS los datos de pilotos, equipos y estadísticas?");
            if (confirm1) {
                let confirm2 = prompt(`Escribe "BORRAR" para confirmar la eliminación de la liga.`);
                if (confirm2 === "BORRAR") {
                    let savedPin = state.pin; // Mantenemos el PIN actual
                    state = JSON.parse(JSON.stringify(defaultState)); // Copia del default
                    state.pin = savedPin;
                    state.drivers = [];
                    state.data = {};
                    currentTabId = state.tabs[0].id;
                    saveData();
                    alert("El campeonato ha sido reseteado.");
                    closeSysModal();
                }
            }
        }

        // FUNCIONES ADMIN
        function addDriver() {
            let name = prompt("Nombre del Piloto:");
            if (!name) return;
            let num = prompt("Número del coche (Ej: #44):") || "0";
            let team = prompt("Escudería:") || "Independiente";
            let color = prompt("Color de escudería (Hexadecimal, ej: #ff0000):") || "#ffffff";
            
            state.drivers.push({ id: Date.now(), num, nombre: name, equipo: team, color });
            saveData();
        }

        function addCustomTab() {
            let name = prompt("Nombre de la tabla (Ej: Formula Timer, Q1, Carrera 2):");
            if (!name) return;
            let newTab = { id: 't_' + Date.now(), name, icon: 'fa-stopwatch', cols: ['Tiempo'] };
            state.tabs.push(newTab);
            currentTabId = newTab.id;
            saveData();
        }

        function addColumn() {
            let tab = state.tabs.find(t => t.id === currentTabId);
            let col = prompt("Nombre de la estadística (Ej: Poles, Sectores, Gap):");
            if (col && !tab.cols.includes(col)) {
                tab.cols.push(col.toUpperCase());
                saveData();
            }
        }

        function deleteCurrentTab() {
            if (state.tabs.length <= 1) return alert("No puedes borrar la última pestaña.");
            if (confirm("¿Borrar esta pestaña y todas sus estadísticas? Los pilotos seguirán guardados.")) {
                state.tabs = state.tabs.filter(t => t.id !== currentTabId);
                delete state.data[currentTabId];
                currentTabId = state.tabs[0].id;
                saveData();
            }
        }

        function deleteRecord(driverId) {
            if(confirm("¿Borrar a este piloto del campeonato?")) {
                state.drivers = state.drivers.filter(d => d.id !== driverId);
                saveData();
            }
        }

        // EDICIÓN EN LÍNEA
        function editCell(driverId, field, isStat = false) {
            if (!isAdmin) return;
            
            let val = "";
            if (isStat) {
                if (!state.data[currentTabId]) state.data[currentTabId] = {};
                if (!state.data[currentTabId][driverId]) state.data[currentTabId][driverId] = {};
                val = state.data[currentTabId][driverId][field] || "";
            } else {
                let driver = state.drivers.find(d => d.id === driverId);
                val = driver[field];
            }

            let newVal = prompt(`Actualizar ${field}:`, val);
            if (newVal !== null) {
                if (isStat) {
                    state.data[currentTabId][driverId][field] = newVal;
                } else {
                    let driver = state.drivers.find(d => d.id === driverId);
                    driver[field] = newVal;
                }
                saveData();
            }
        }

        // RENDERIZADO
        function renderAll() {
            if(state.tabs.length === 0) return;
            renderTabs();
            renderCards();
            renderTable();
        }

        function renderTabs() {
            let html = '';
            state.tabs.forEach(tab => {
                let active = tab.id === currentTabId ? 'active' : '';
                html += `<button class="tab-btn ${active}" onclick="currentTabId='${tab.id}'; renderAll();">
                            <i class="fa-solid ${tab.icon}"></i> ${tab.name}
                         </button>`;
            });
            document.getElementById('tabsContainer').innerHTML = html;
        }

        function renderCards() {
            let tab = state.tabs.find(t => t.id === currentTabId);
            if(!tab) return;
            let sortCol = tab.cols[0]; 
            
            let records = [];
            state.drivers.forEach(d => {
                let val = (state.data[currentTabId] && state.data[currentTabId][d.id] && state.data[currentTabId][d.id][sortCol]) || 0;
                records.push({ ...d, sortVal: val });
            });

            records.sort((a, b) => {
                let numA = parseFloat(a.sortVal) || 0;
                let numB = parseFloat(b.sortVal) || 0;
                return numB - numA; 
            });

            let topDriver = records[0] || { nombre: '-', sortVal: '-' };
            let totalDrivers = state.drivers.length;
            let uniqueTeams = new Set(state.drivers.map(d => d.equipo)).size;

            let html = `
                <div class="card">
                    <div class="card-icon card-1"><i class="fa-solid fa-crown"></i></div>
                    <div class="card-info"><span>Líder de Pestaña</span><h4>${topDriver.nombre}</h4><small>${topDriver.sortVal} ${sortCol || ''}</small></div>
                </div>
                <div class="card">
                    <div class="card-icon card-2"><i class="fa-solid fa-flag-checkered"></i></div>
                    <div class="card-info"><span>Total Inscritos</span><h4>${totalDrivers} Pilotos</h4></div>
                </div>
                <div class="card">
                    <div class="card-icon card-3"><i class="fa-solid fa-shield-halved"></i></div>
                    <div class="card-info"><span>Parrilla</span><h4>${uniqueTeams} Escuderías</h4></div>
                </div>
                <div class="card">
                    <div class="card-icon card-4"><i class="fa-solid fa-chart-line"></i></div>
                    <div class="card-info"><span>Vista Actual</span><h4>${tab.name}</h4></div>
                </div>
            `;
            document.getElementById('dashboardCards').innerHTML = html;
        }

        function renderTable() {
            let tab = state.tabs.find(t => t.id === currentTabId);
            if(!tab) return;
            let search = document.getElementById('searchInput').value.toLowerCase();
            
            // Render Headers
            let headHtml = `<tr>
                <th style="width: 40px; text-align: center;">POS</th>
                <th>PILOTO</th>
                <th>ESCUDERÍA</th>`;
            tab.cols.forEach(col => headHtml += `<th>${col}</th>`);
            if (isAdmin) headHtml += `<th>ACCIONES</th>`;
            headHtml += `</tr>`;
            document.getElementById('tableHead').innerHTML = headHtml;

            // Prepare Data
            let sortCol = tab.cols[0];
            let records = [];
            state.drivers.forEach(d => {
                let statsObj = (state.data[currentTabId] && state.data[currentTabId][d.id]) || {};
                records.push({ ...d, stats: statsObj });
            });

            // Ordenamiento Básico
            records.sort((a, b) => {
                let numA = parseFloat(a.stats[sortCol]) || 0;
                let numB = parseFloat(b.stats[sortCol]) || 0;
                return numB - numA;
            });

            // Filtrado
            records = records.filter(r => 
                r.nombre.toLowerCase().includes(search) || 
                r.equipo.toLowerCase().includes(search) ||
                r.num.toString().includes(search)
            );

            // Render Body
            let bodyHtml = '';
            records.forEach((r, index) => {
                let rowClass = index === 0 ? 'pos-1' : index === 1 ? 'pos-2' : index === 2 ? 'pos-3' : '';
                let posDisplay = index < 3 ? `<div class="pos-badge">${index + 1}</div>` : `#${index + 1}`;
                
                bodyHtml += `<tr class="${rowClass}">
                    <td style="text-align: center;">${posDisplay}</td>
                    <td>
                        <span class="driver-num ${isAdmin?'editable':''}" onclick="editCell(${r.id}, 'num')">#${r.num}</span> 
                        <span class="${isAdmin?'editable':''}" style="font-weight: 700; color: #fff;" onclick="editCell(${r.id}, 'nombre')">${r.nombre}</span>
                    </td>
                    <td>
                        <span class="team-dot" style="background: ${r.color};" onclick="editCell(${r.id}, 'color')"></span> 
                        <span class="${isAdmin?'editable':''}" style="color: var(--text-muted);" onclick="editCell(${r.id}, 'equipo')">${r.equipo}</span>
                    </td>`;
                
                tab.cols.forEach(col => {
                    let val = r.stats[col] || "-";
                    if (col === 'PEN' && val > 0 && val !== "-") {
                        bodyHtml += `<td class="${isAdmin?'editable':''}" onclick="editCell(${r.id}, '${col}', true)"><span class="penal-box">${val}</span></td>`;
                    } else {
                        let colorStyle = (col === sortCol) ? 'color: var(--primary); font-weight: 700;' : 'color: var(--text-muted);';
                        bodyHtml += `<td class="${isAdmin?'editable':''}" style="${colorStyle}" onclick="editCell(${r.id}, '${col}', true)">${val}</td>`;
                    }
                });

                if (isAdmin) {
                    bodyHtml += `<td class="action-icons">
                        <i class="fa-solid fa-pen" onclick="editCell(${r.id}, 'nombre')"></i>
                        <i class="fa-solid fa-trash" onclick="deleteRecord(${r.id})"></i>
                    </td>`;
                }
                bodyHtml += `</tr>`;
            });

            if (records.length === 0) {
                bodyHtml = `<tr><td colspan="${tab.cols.length + 4}" style="text-align: center; padding: 30px; color: var(--text-muted);">No se encontraron registros.</td></tr>`;
            }

            document.getElementById('tableBody').innerHTML = bodyHtml;
        }

        // Inicializar
        renderAll();
    </script>
</body>
</html>
